# ENARM Contraste dedicated host
server {
    listen 80;
    listen [::]:80;
    server_name enarm.musel.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://enarm.musel.dev$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name enarm.musel.dev;

    ssl_certificate /etc/letsencrypt/live/enarm.musel.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/enarm.musel.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    root /var/www/enarm-contraste/site-current;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }
    location /study/ {
        try_files $uri =404;
        types { application/json json; application/octet-stream apkg; }
        expires -1;
    }
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
